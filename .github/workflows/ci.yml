name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.2

      - name: Verify Xmake Version
        run: xmake --version

      - name: Install System Lua (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          sudo update-alternatives --install /usr/bin/lua lua /usr/bin/lua5.4 100 || sudo ln -sf /usr/bin/lua5.4 /usr/bin/lua

      - name: Install System Lua (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install lua
          sudo ln -sf "$(brew --prefix)/bin/lua" /usr/local/bin/lua 2>/dev/null || true

      - name: Install Forge Addon
        run: xmake addon --install .

      - name: Run Test Suite (xmake test)
        run: xmake test

      - name: Run Direct Test Runner (xmake l tests/run.lua)
        run: xmake l tests/run.lua

      - name: Verify Forge CLI Plugin (list, env & json export)
        run: |
          xmake forge list
          xmake forge env
          JSON_OUT=$(xmake forge env --json)
          echo "$JSON_OUT"
          echo "$JSON_OUT" | grep -q "LUA_PATH"
          echo "$JSON_OUT" | grep -q "LUA_CPATH"
